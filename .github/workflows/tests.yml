name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Python tests (core.py)
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest

      - name: JavaScript tests (encryption)
        run: node --test
